<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title></title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta
      name="description"
      content=""
    />
    <meta
      name="robots"
      content="noindex,nofollow"
    />
    <meta
      name="color-scheme"
      content="light"
    />
    <meta
      name="theme-color"
      content="#b7c77d"
    />
    <script>
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
        const dark =
          theme === 'dark' ||
          (theme !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', dark ? '#243a1f' : '#b7c77d');
      } catch {}
    </script>
    <link
      rel="preload"
      href="/fonts/GeistMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/GeistPixel-Square.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="favicon.svg"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
